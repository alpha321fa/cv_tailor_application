<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{ cv.name }} - CV</title>
<style>
  /* xhtml2pdf supports only a subset of CSS: no flexbox or grid.
     Tables are used for the "title ... dates" rows. */
  /* Embedded font: the built-in Helvetica can't draw characters like Ł or →. */
  @font-face { font-family: DejaVuSans; src: url("{{ font_dir }}/DejaVuSans.ttf"); }
  @font-face { font-family: DejaVuSans; font-weight: bold; src: url("{{ font_dir }}/DejaVuSans-Bold.ttf"); }
  @page { size: a4; margin: 1.6cm 1.8cm; }
  body { font-family: DejaVuSans; font-size: 10pt; color: #222; line-height: 1.3; }
  h1 { font-size: 20pt; margin: 0; }
  .contact { color: #555; margin-top: 2pt; }
  h2 { font-size: 11pt; text-transform: uppercase; color: #1f4e79;
       border-bottom: 1px solid #1f4e79; margin: 12pt 0 4pt 0; padding-bottom: 1pt; }
  table.row { width: 100%; margin-top: 6pt; }
  td.dates { text-align: right; color: #555; width: 30%; }
  .sub { color: #555; }
  .project { margin-top: 6pt; }
  ul { margin: 2pt 0 0 0; padding-left: 14pt; }
  li { margin-bottom: 1pt; }
  p { margin: 2pt 0; }
</style>
</head>
<body>
{% include "partials/cv_content.html" %}
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Tailor</title>
  {# htmx 2 doesn't swap 4xx/5xx responses by default. We return real error status
     codes AND want the error message shown, so allow swapping those too. #}
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[2345]..", "swap": true}]}'>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
